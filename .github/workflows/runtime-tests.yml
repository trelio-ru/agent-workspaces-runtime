name: Host runtime tests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

env:
  TRELIO_AGENT_WORKSPACES_PLUGIN_ROOT: ${{ github.workspace }}/_contracts/agent-workspaces/plugins/trelio-agent-workspaces
  TRELIO_AGENT_SKILLS_ROOT: ${{ github.workspace }}/_contracts/agent-skills

jobs:
  visual-browser:
    if: github.event_name == 'pull_request'
    name: Native visual browser (${{ matrix.os }})
    needs: windows-private-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm, ubuntu-latest]
    env:
      TRELIO_VISUAL_NATIVE_TEST: '1'
      TRELIO_VISUAL_EXTENSION_TEST: '1'
      TRELIO_VISUAL_EXTENSION_HEADED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-private-worker
          path: host-runtime/scripts/native-private-process/bin
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Install exact test dependencies
        shell: bash
        run: |
          npm run worktree:bootstrap
          npm ci --prefix host-runtime/scripts/visual-browser-dependencies --ignore-scripts --no-audit --no-fund
      - name: Install Linux desktop and native credential service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0 xvfb apparmor
          sudo node host-runtime/scripts/visual-browser-dependencies/node_modules/playwright-core/cli.js install-deps chromium
      - name: Cold managed Chromium bootstrap
        shell: bash
        run: node --input-type=module -e 'import {loadVisualDependencies,ensureVisualChromium} from "./host-runtime/scripts/trelio-visual-bootstrap.mjs"; await ensureVisualChromium(await loadVisualDependencies());'
      # Ubuntu blocks user namespaces for downloaded Chromium paths. Grant
      # userns to this exact CI binary only; keep Chromium's sandbox enabled
      # and do not weaken the runner's global kernel/AppArmor policy.
      - name: Allow sandbox namespaces for exact Linux fixture browser
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { loadVisualDependencies, ensureVisualChromium } from './host-runtime/scripts/trelio-visual-bootstrap.mjs';
          const binary = await ensureVisualChromium(await loadVisualDependencies());
          const quoted = binary.replace(/["\\]/g, '\\$&');
          await fs.writeFile(path.join(process.env.RUNNER_TEMP, 'trelio-visual.apparmor'), `abi <abi/4.0>,\ninclude <tunables/global>\nprofile trelio-visual-ci "${quoted}" flags=(unconfined) {\n  userns,\n}\n`);
          NODE
          sudo apparmor_parser -r "$RUNNER_TEMP/trelio-visual.apparmor"
      - name: Run native Windows or macOS fixtures
        if: runner.os != 'Linux'
        shell: bash
        run: |
          node tests/trelio-visual-native-store.test.mjs
          node tests/trelio-visual-store.test.mjs
          node tests/trelio-visual-transport.test.mjs
          node tests/trelio-visual-browser.test.mjs
          node tests/trelio-visual-profile.test.mjs
          node tests/trelio-visual-cookie-state.test.mjs
          node tests/trelio-visual-link-router.test.mjs
          node tests/trelio-visual-extension-worker.test.mjs
          node tests/trelio-visual-extension-browser.test.mjs
          node tests/trelio-visual-session.test.mjs
      - name: Run Linux desktop fixtures with real Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            for file in native-store store transport profile cookie-state browser link-router extension-worker extension-browser session; do
              xvfb-run -a node "tests/trelio-visual-${file}.test.mjs"
            done
          '

  windows-private-build:
    if: github.event_name == 'pull_request'
    name: Build native Windows private worker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Build deterministic native workers
        shell: pwsh
        run: |
          ./scripts/build-windows-private-worker.ps1
          Copy-Item host-runtime/scripts/native-private-process/bin/metadata.json "$env:RUNNER_TEMP/native-first.json"
          ./scripts/build-windows-private-worker.ps1
          node -e 'const fs=require("fs"),a=require("assert/strict");const read=p=>JSON.parse(fs.readFileSync(p,"utf8").replace(/^\uFEFF/,""));a.deepEqual(read(process.argv[1]),read(process.argv[2]))' "$env:RUNNER_TEMP/native-first.json" host-runtime/scripts/native-private-process/bin/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-private-worker
          path: host-runtime/scripts/native-private-process/bin
          if-no-files-found: error

  windows-native-arm:
    if: github.event_name == 'pull_request'
    name: Native Windows private worker (arm64)
    needs: windows-private-build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-private-worker
          path: host-runtime/scripts/native-private-process/bin
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          architecture: arm64
      - name: Verify native ARM64 ACL and DPAPI
        run: node tests/trelio-windows-native-private.test.mjs

  git-main-guard:
    if: github.event_name == 'pull_request'
    name: Canonical main Git guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out runtime repository
        uses: actions/checkout@v4

      - name: Run canonical main guard regressions
        run: npm run test:worktree-bootstrap && npm run test:git-guard

  node-tests:
    if: github.event_name == 'pull_request'
    name: Runtime tests (${{ matrix.os }})
    needs: windows-private-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out runtime repository
        uses: actions/checkout@v4

      # Cross-repository tests consume the real stable shell. The checkout is
      # read-only test input and is never copied into a runtime package.
      - uses: actions/download-artifact@v4
        with:
          name: windows-private-worker
          path: host-runtime/scripts/native-private-process/bin

      - name: Check out plugin contract
        uses: actions/checkout@v4
        with:
          repository: trelio-ru/agent-workspaces
          path: _contracts/agent-workspaces

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install pinned report dependencies
        run: npm run worktree:bootstrap

      - name: Verify local dependency tree
        run: npm run check:dependencies

      # Execute files directly: a parent node:test process has intermittently
      # corrupted serialized child IPC under load on hosted runners.
      - name: Run host runtime tests
        run: |
          node tests/context-budget.test.mjs
          node tests/trelio-browser-open.test.mjs
          node tests/trelio-browser-session.test.mjs
          node tests/trelio-browser-http.test.mjs
          node tests/trelio-visual-store.test.mjs
          node tests/trelio-visual-transport.test.mjs
          node tests/trelio-visual-browser.test.mjs
          node tests/trelio-visual-profile.test.mjs
          node tests/trelio-visual-cookie-state.test.mjs
          node tests/trelio-visual-link-router.test.mjs
          node tests/trelio-visual-extension-worker.test.mjs
          node tests/trelio-visual-extension-browser.test.mjs
          node tests/trelio-visual-native-store.test.mjs
          node tests/trelio-visual-session.test.mjs
          node tests/trelio-codex-routing.test.mjs
          node tests/trelio-codex-conversation.test.mjs
          node tests/trelio-company-encryption.test.mjs
          node tests/trelio-context-search-matching.test.mjs
          node tests/trelio-context-search-ranking.test.mjs
          node tests/trelio-encrypted-workspace-storage.test.mjs
          node tests/trelio-folder-onboarding.test.mjs
          node tests/trelio-git.test.mjs
          node tests/trelio-skill-accounts.test.mjs
          node tests/trelio-assistant-inbox.test.mjs
          node tests/trelio-assistant-scheduler.test.mjs
          node tests/trelio-assistant-codex.test.mjs
          node tests/trelio-assistant-private.test.mjs
          node tests/trelio-assistant-transport.test.mjs
          node tests/trelio-assistant-coordinator.test.mjs
          node tests/trelio-host-runtime-entry.test.mjs
          node tests/trelio-hook-signed-chain.test.mjs
          node tests/trelio-host-runtime-recovery.test.mjs
          node tests/trelio-local-attachments.test.mjs
          node tests/trelio-proposal-local-files.test.mjs
          node tests/trelio-local-path.test.mjs
          node tests/trelio-local-context.test.mjs
          node tests/trelio-mirror-retention.test.mjs
          node tests/trelio-python.test.mjs
          node tests/trelio-mcp-results.test.mjs
          node tests/trelio-remote-mcp-oauth.test.mjs
          node tests/trelio-agent-diagnostics.test.mjs
          node tests/trelio-antigravity.test.mjs
          node tests/trelio-remote-mcp.test.mjs
          node tests/trelio-runtime-policy.test.mjs
          node tests/trelio-hook-tool-identity.test.mjs
          node tests/trelio-hook-private-session.test.mjs
          node tests/trelio-windows-startup-diagnostic.test.mjs
          node tests/trelio-windows-native-private.test.mjs
          node tests/trelio-runtime-session-timeout.test.mjs
          node tests/trelio-runtime-session.test.mjs
          node tests/trelio-unfiled-context.test.mjs
          node tests/trelio-runtime-proof-preparation.test.mjs
          node tests/trelio-instruction-reuse.test.mjs
          node tests/trelio-local-continuation.test.mjs
          node tests/trelio-secret-browser-native.test.mjs
          node tests/trelio-secret-chat.test.mjs
          node tests/trelio-secret-generate.test.mjs
          node tests/trelio-skill-admission.test.mjs
          node tests/trelio-skill-secret-setup.test.mjs
          node tests/trelio-workspace-action-process.test.mjs
          node tests/trelio-workspace-finish-progress.test.mjs
          node tests/trelio-workspace-directory.test.mjs
          node tests/trelio-workspace-files.test.mjs
          node tests/trelio-workspace.test.mjs

      - name: Build deterministic runtime packages
        shell: bash
        run: |
          node scripts/build-host-runtime-package.mjs --runtime-version 0.0.0 --output "$RUNNER_TEMP/runtime-a.skillpkg"
          node scripts/build-host-runtime-package.mjs --runtime-version 0.0.0 --output "$RUNNER_TEMP/runtime-b.skillpkg"
          cmp "$RUNNER_TEMP/runtime-a.skillpkg" "$RUNNER_TEMP/runtime-b.skillpkg"

  windows-acl:
    if: github.event_name == 'pull_request'
    name: Windows runtime and private ACL
    needs: windows-private-build
    runs-on: windows-latest

    steps:
      - name: Check out runtime repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-private-worker
          path: host-runtime/scripts/native-private-process/bin

      - name: Check out plugin contract
        uses: actions/checkout@v4
        with:
          repository: trelio-ru/agent-workspaces
          path: _contracts/agent-workspaces

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      # The Python regression relocates a real interpreter into the default
      # per-user layout. PATH alone cannot prove this installation is accepted.
      - name: Set up Python fixture
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pin the real public Telegram importer; it is test input only and never
      # enters the generic host package or receives private provider credentials.
      - name: Check out public account-import contract
        uses: actions/checkout@v4
        with:
          repository: trelio-ru/agent-skills
          ref: 620044d67eb3a74fafdc11a00bb023240c3e2259
          path: _contracts/agent-skills

      - name: Run Windows encrypted mirror retention regressions
        run: node tests/trelio-mirror-retention.test.mjs

      - name: Run Windows Python discovery and isolation regressions
        run: node tests/trelio-python.test.mjs

      - name: Run admission cache boundary regressions
        run: node tests/trelio-skill-admission.test.mjs

      - name: Run signed setup boundary regressions
        run: node tests/trelio-skill-secret-setup.test.mjs

      - name: Run Windows runtime recovery regressions
        run: node tests/trelio-host-runtime-recovery.test.mjs

      - name: Run Windows diagnostic regressions
        run: node tests/trelio-agent-diagnostics.test.mjs

      - name: Run Windows Antigravity native shell diagnostics
        run: node tests/trelio-antigravity.test.mjs

      - name: Run Windows folder diagnostic and instruction refresh regressions
        run: node tests/trelio-folder-onboarding.test.mjs

      - name: Run Windows personal account catalogue regressions
        run: node tests/trelio-skill-accounts.test.mjs

      - name: Run Windows assistant runtime and private storage regressions
        run: |
          node tests/trelio-assistant-inbox.test.mjs
          node tests/trelio-assistant-scheduler.test.mjs
          node tests/trelio-assistant-codex.test.mjs
          node tests/trelio-assistant-private.test.mjs
          node tests/trelio-assistant-transport.test.mjs
          node tests/trelio-assistant-coordinator.test.mjs

      - name: Run Windows ACL regressions
        run: >-
          node --test
          --test-name-pattern="Windows ACL command|Windows bridge applies|Windows DPAPI|Windows Node resolver|Windows Remote MCP launcher|bridge pairs once|connection-free skill runtime"
          tests/trelio-workspace.test.mjs

      - name: Run Windows browser HTTP evidence regressions
        run: node tests/trelio-browser-http.test.mjs

      - name: Run Windows browser bootstrap and npm discovery regressions
        run: node tests/trelio-browser-session.test.mjs

      # Реальный зарегистрированный URI handler принимает synthetic query целиком.
      # Это проверяет ShellExecute, а не только mock argv или успешный spawn.
      - name: Run Windows browser URL handoff regressions
        run: node tests/trelio-browser-open.test.mjs

      - name: Run Windows Git prerequisite regressions
        run: node --test tests/trelio-git.test.mjs

      - name: Run Windows proposal local file regressions
        run: node tests/trelio-proposal-local-files.test.mjs

      - name: Run Windows private attachment delivery regressions
        run: node tests/trelio-local-attachments.test.mjs

      - name: Run Windows encrypted Workspace file delivery regressions
        run: node tests/trelio-workspace-files.test.mjs

      - name: Run Windows Workspace subprocess regressions
        run: node tests/trelio-workspace-action-process.test.mjs

      - name: Run Windows finish progress and process lock regressions
        run: node tests/trelio-workspace-finish-progress.test.mjs

      - name: Run Windows Workspace saving and rate-limit regressions
        run: >-
          node --test
          --test-name-pattern="bridge draft and finish survive|bridge finish recovers saved handoff|plain mutation retry|429 respects|HTTP retry"
          tests/trelio-workspace.test.mjs tests/trelio-encrypted-workspace-storage.test.mjs

      - name: Run Windows Workspace directory selection regressions
        run: node tests/trelio-workspace-directory.test.mjs

      - name: Run Windows path comparison regressions
        run: node tests/trelio-local-path.test.mjs

      - name: Run Windows embedded browser transport regressions
        run: node tests/trelio-secret-browser-native.test.mjs

      - name: Run Windows hook launcher regression
        run: >-
          node --test
          --test-name-pattern="configured platform hook launcher|event session identity|pairing recovery|resume and compact|bounded cleanup|malformed Trelio action|SessionStart pins|discovery strips|chat binding"
          tests/trelio-runtime-session.test.mjs

      - name: Run Windows hook tool identity regressions
        run: node tests/trelio-hook-tool-identity.test.mjs

      - name: Run Windows company-scoped unfiled contract regressions
        run: node tests/trelio-unfiled-context.test.mjs

      - name: Run Windows proof preparation regressions
        run: |
          node tests/trelio-runtime-proof-preparation.test.mjs
          node --test --test-name-pattern="first protected call" tests/trelio-runtime-session.test.mjs

      - name: Verify signed runtime hook through the complete Windows shell chain
        run: node tests/trelio-hook-signed-chain.test.mjs

      - name: Run Windows Codex conversation metadata tests
        run: node tests/trelio-codex-conversation.test.mjs

      - name: Run Windows instruction delivery regressions
        run: |
          node tests/trelio-instruction-reuse.test.mjs
          node tests/trelio-local-continuation.test.mjs

      - name: Run Windows persisted hook settings diagnostics
        run: node --test --test-name-pattern="persisted hook" tests/trelio-codex-routing.test.mjs

      - name: Run native Windows private process regressions
        run: node tests/trelio-windows-native-private.test.mjs

      - name: Run Windows hook private process regressions
        run: node tests/trelio-hook-private-session.test.mjs

      - name: Run read-only Windows worker startup diagnostic regressions
        run: node tests/trelio-windows-startup-diagnostic.test.mjs

      - name: Run Windows hook timeout regressions
        run: node tests/trelio-runtime-session-timeout.test.mjs

      - name: Run Windows Remote MCP handshake regression
        run: >-
          node --test
          --test-name-pattern="stdio initialize is not blocked by Codex plugin retention|stdio startup trace"
          tests/trelio-remote-mcp.test.mjs

      - name: Run Windows MCP entrypoint trace regressions
        run: node tests/trelio-host-runtime-entry.test.mjs

      - name: Run Windows Remote MCP OAuth storage regressions
        run: node tests/trelio-remote-mcp-oauth.test.mjs

      - name: Set up current Node.js for private worker compatibility
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Run slow-start private worker on Node.js 24
        run: |
          node tests/trelio-hook-private-session.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/trelio-windows-native-private.test.mjs

      # Desktop clients may carry Node 24 independently of the supported backend
      # Node 22. Exercise the reported Python/execFile boundary on that host too.
      - name: Run Windows account import on Node.js 24
        run: |
          node tests/trelio-python.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/trelio-skill-accounts.test.mjs

      - name: Run Windows ACL regression as a standard user
        shell: pwsh
        run: ./.github/scripts/run-windows-acl-standard-user.ps1

  release-artifact:
    name: Tagged host runtime package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verified-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Download the exact PR-tested native binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-private-worker
          path: host-runtime/scripts/native-private-process/bin
          run-id: ${{ needs.verified-source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Build exact tagged runtime
        shell: bash
        run: node scripts/build-host-runtime-package.mjs --runtime-version "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/host-runtime.skillpkg"
      - uses: actions/upload-artifact@v4
        with:
          name: host-runtime-package
          path: ${{ runner.temp }}/host-runtime.skillpkg
          if-no-files-found: error

  verified-source:
    outputs:
      run-id: ${{ steps.gate.outputs.run-id }}
    name: Verify exact hosted PR gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require complete successful PR gate for this exact SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/runtime-tests.yml/runs?head_sha=$GITHUB_SHA&event=pull_request&status=success" > "$RUNNER_TEMP/runs.json"
          node -e 'const fs=require("fs");const runs=JSON.parse(fs.readFileSync(process.argv[1])).workflow_runs.filter(r=>r.head_sha===process.env.GITHUB_SHA&&r.event==="pull_request"&&r.conclusion==="success");if(!runs.length)throw Error("Exact successful PR gate is required");fs.writeFileSync(process.argv[2],String(runs[0].id))' "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/run-id"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$(cat "$RUNNER_TEMP/run-id")/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node -e 'const fs=require("fs");const jobs=JSON.parse(fs.readFileSync(process.argv[1])).jobs;for(const name of ["Canonical main Git guard","Runtime tests (ubuntu-latest)","Runtime tests (macos-latest)","Windows runtime and private ACL","Build native Windows private worker","Native Windows private worker (arm64)","Native visual browser (macos-latest)","Native visual browser (windows-latest)","Native visual browser (windows-11-arm)","Native visual browser (ubuntu-latest)"])if(!jobs.some(j=>j.name===name&&j.conclusion==="success"))throw Error("Incomplete exact OS gate: "+name)' "$RUNNER_TEMP/jobs.json"

          echo "run-id=$(cat "$RUNNER_TEMP/run-id")" >> "$GITHUB_OUTPUT"
